<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lumen Relay</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080f;
      --fg: #e8f0ff;
      --muted: #6b7a99;
      --accent: #4fd1ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--fg);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #game {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      background: var(--bg);
      box-shadow: 0 0 60px rgba(79, 209, 255, 0.12);
      image-rendering: auto;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      padding: 6px 14px;
      border: 1px solid rgba(107, 122, 153, 0.35);
      border-radius: 999px;
      background: rgba(5, 8, 15, 0.72);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .hint b {
      color: var(--accent);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .hint {
        font-size: 10px;
        bottom: 8px;
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="Lumen Relay game"></canvas>
  <div class="hint">
    <b>Click</b> a mirror to rotate &middot; <b>1-9</b> select &middot; <b>R</b> rotate &middot; <b>Space</b> start
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
